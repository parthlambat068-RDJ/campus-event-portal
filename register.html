<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register | RCOEM Events</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head><body>
<nav class="navbar navbar-expand-md navbar-dark"><div class="container">
<a class="navbar-brand" href="index.html">RCOEM Events</a>
<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nv" aria-label="Menu"><span class="navbar-toggler-icon"></span></button>
<div class="collapse navbar-collapse" id="nv"><ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link " href="index.html">Home</a></li>
<li class="nav-item"><a class="nav-link " href="events.html">All events</a></li>
<li class="nav-item"><a class="nav-link active" href="register.html">Register</a></li>
</ul></div></div></nav>
<main class="container mt-5" style="max-width:560px"><h2>Register for an event</h2>
<form class="event-card p-4 mt-3" onsubmit="event.preventDefault();document.getElementById('ok').classList.remove('d-none')">
<div class="mb-3"><label class="form-label" for="n">Full name</label><input id="n" class="form-control" required></div>
<div class="mb-3"><label class="form-label" for="e">College email</label><input id="e" type="email" class="form-control" required></div>
<div class="mb-3"><label class="form-label" for="ev">Event</label><select id="ev" class="form-select"><option>CodeSprint Hackathon</option><option>Figma for Beginners</option><option>Annual Cultural Night</option></select></div>
<button class="btn btn-teal w-100">Confirm registration</button>
<div id="ok" class="alert alert-success mt-3 d-none" role="status">You're registered. Check your email for details.</div></form></main>
<footer><div class="container d-flex flex-wrap justify-content-between"><span>RCOEM Events, Nagpur</span><span>LA-II project: Figma + HTML + Bootstrap</span></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
